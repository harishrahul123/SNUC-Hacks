<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PocketCFO — Smart Cash Flow Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0a0c0f;
    --surface: #111418;
    --surface2: #181c22;
    --border: #1e2530;
    --border2: #252d3a;
    --accent: #00e5a0;
    --accent2: #0091ff;
    --danger: #ff4757;
    --warn: #ffa502;
    --text: #e8edf5;
    --text2: #7a8799;
    --text3: #3d4a5c;
    --card-shadow: 0 2px 24px rgba(0,0,0,0.4);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ═══════════════════════════════════════════════
     AUTH PAGE STYLES (THE NEW LOGIN PAGE)
  ═══════════════════════════════════════════════ */
  .auth-container {
    position: fixed; inset: 0; display: flex;
    background: var(--bg); z-index: 10000;
  }
  .auth-left {
    flex: 1; display: flex; flex-direction: column; justify-content: center;
    padding: 60px; position: relative; border-right: 1px solid var(--border);
    background: linear-gradient(135deg, rgba(0,229,160,0.05) 0%, transparent 100%);
  }
  .auth-right {
    width: 500px; display: flex; align-items: center; justify-content: center;
    padding: 40px; position: relative;
  }
  .auth-card {
    width: 100%; max-width: 400px; background: var(--surface);
    border: 1px solid var(--border2); border-radius: 24px;
    padding: 40px; box-shadow: var(--card-shadow);
  }
  .auth-logo {
    font-family: 'Syne', sans-serif; font-size: 32px; font-weight: 800;
    color: var(--text); margin-bottom: 8px; letter-spacing: -1px;
  }
  .auth-logo span { color: var(--accent); }
  .auth-title { font-family: 'Syne', sans-serif; font-size: 24px; font-weight: 700; margin-bottom: 24px; }
  
  .form-group { margin-bottom: 16px; }
  .form-label { font-size: 11px; color: var(--text2); font-family: 'DM Mono', monospace; text-transform: uppercase; margin-bottom: 6px; display: block; }
  .input {
    width: 100%; background: var(--bg); border: 1px solid var(--border2);
    border-radius: 10px; padding: 12px 16px; color: var(--text);
    font-size: 14px; outline: none; transition: border 0.2s;
  }
  .input:focus { border-color: var(--accent); }
  
  .btn-auth {
    width: 100%; padding: 14px; border-radius: 12px; background: var(--accent);
    color: #000; font-weight: 700; font-family: 'Syne', sans-serif;
    border: none; cursor: pointer; margin-top: 10px; transition: 0.2s;
  }
  .btn-auth:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,229,160,0.3); }

  .google-btn {
    width: 100%; padding: 12px; border-radius: 12px; background: white;
    color: #000; font-weight: 600; border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    margin-bottom: 20px; font-size: 14px;
  }

  .switch-auth {
    text-align: center; margin-top: 20px; font-size: 13px; color: var(--text2);
  }
  .switch-auth span { color: var(--accent); cursor: pointer; font-weight: 600; text-decoration: underline; }

  /* MOCK DASHBOARD STYLES (SIMPLIFIED FOR THE EXAMPLE) */
  .app-container { display: flex; min-height: 100vh; }
  .sidebar { width: 240px; background: var(--surface); border-right: 1px solid var(--border); padding: 30px 20px; }
  .main-content { flex: 1; padding: 40px; }
  .user-badge { display: flex; align-items: center; gap: 12px; padding: 12px; background: var(--surface2); border-radius: 12px; margin-top: auto; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

<script>
const { useState, useEffect } = React;

function App() {
  const [currentUser, setCurrentUser] = useState(null);
  const [isLoginView, setIsLoginView] = useState(true);
  const [authData, setAuthData] = useState({ email: '', password: '', name: '', age: '', business: '' });
  const [error, setError] = useState('');

  // 1. Persistance: Check if user was already logged in
  useEffect(() => {
    const savedUser = localStorage.getItem('pocketCFO_session');
    if (savedUser) setCurrentUser(JSON.parse(savedUser));
  }, []);

  const handleAuthAction = (e) => {
    e.preventDefault();
    setError('');

    // Basic Validation
    if (!authData.email.includes('@')) {
      setError('Please enter a valid email address.');
      return;
    }
    if (authData.password.length < 6) {
      setError('Password must be at least 6 characters.');
      return;
    }

    const users = JSON.parse(localStorage.getItem('pocketCFO_users') || '[]');

    if (isLoginView) {
      // LOGIN LOGIC
      const user = users.find(u => u.email === authData.email && u.password === authData.password);
      if (user) {
        setCurrentUser(user);
        localStorage.setItem('pocketCFO_session', JSON.stringify(user));
      } else {
        setError('Invalid email or password.');
      }
    } else {
      // SIGNUP LOGIC
      if (users.find(u => u.email === authData.email)) {
        setError('User already exists. Please log in.');
        return;
      }
      const newUser = { ...authData, id: Date.now() };
      users.push(newUser);
      localStorage.setItem('pocketCFO_users', JSON.stringify(users));
      setCurrentUser(newUser);
      localStorage.setItem('pocketCFO_session', JSON.stringify(newUser));
    }
  };

  const logout = () => {
    localStorage.removeItem('pocketCFO_session');
    setCurrentUser(null);
    setAuthData({ email: '', password: '', name: '', age: '', business: '' });
  };

  // ─── AUTH PAGE COMPONENT ───
  if (!currentUser) {
    return React.createElement('div', { className: 'auth-container' },
      React.createElement('div', { className: 'auth-left' },
        React.createElement('div', { className: 'auth-logo' }, 'Pocket', React.createElement('span', null, 'CFO')),
        React.createElement('h1', { style: { fontSize: '48px', marginBottom: '20px', fontFamily: 'Syne' } }, 'Your AI-Powered Financial Command Center.'),
        React.createElement('p', { style: { color: 'var(--text2)', fontSize: '18px', maxWidth: '500px' } }, 'Automate cash flow, predict runway, and manage obligations with the intelligence of llama-3.')
      ),
      React.createElement('div', { className: 'auth-right' },
        React.createElement('div', { className: 'auth-card' },
          React.createElement('h2', { className: 'auth-title' }, isLoginView ? 'Welcome Back' : 'Create Account'),
          
          React.createElement('button', { className: 'google-btn' }, 
            React.createElement('img', { src: 'https://cdn-icons-png.flaticon.com/128/300/300221.png', width: 18 }),
            'Continue with Google'
          ),

          React.createElement('div', { style: { textAlign: 'center', margin: '15px 0', color: 'var(--text3)', fontSize: '12px' } }, 'OR USE EMAIL'),

          React.createElement('form', { onSubmit: handleAuthAction },
            !isLoginView && React.createElement('div', { className: 'form-group' },
              React.createElement('label', { className: 'form-label' }, 'Full Name'),
              React.createElement('input', { className: 'input', placeholder: 'John Doe', value: authData.name, onChange: e => setAuthData({...authData, name: e.target.value}), required: true })
            ),
            React.createElement('div', { className: 'form-group' },
              React.createElement('label', { className: 'form-label' }, 'Email Address'),
              React.createElement('input', { className: 'input', type: 'email', placeholder: 'name@company.com', value: authData.email, onChange: e => setAuthData({...authData, email: e.target.value}), required: true })
            ),
            React.createElement('div', { className: 'form-group' },
              React.createElement('label', { className: 'form-label' }, 'Password'),
              React.createElement('input', { className: 'input', type: 'password', placeholder: '••••••••', value: authData.password, onChange: e => setAuthData({...authData, password: e.target.value}), required: true })
            ),
            !isLoginView && React.createElement('div', { style: { display: 'grid', gridTemplateColumns: '1fr 2fr', gap: '10px' } },
              React.createElement('div', { className: 'form-group' },
                React.createElement('label', { className: 'form-label' }, 'Age'),
                React.createElement('input', { className: 'input', type: 'number', placeholder: '25', value: authData.age, onChange: e => setAuthData({...authData, age: e.target.value}) })
              ),
              React.createElement('div', { className: 'form-group' },
                React.createElement('label', { className: 'form-label' }, 'Business Name'),
                React.createElement('input', { className: 'input', placeholder: 'Acme Inc.', value: authData.business, onChange: e => setAuthData({...authData, business: e.target.value}) })
              )
            ),
            error && React.createElement('p', { style: { color: 'var(--danger)', fontSize: '12px', marginBottom: '10px' } }, error),
            React.createElement('button', { className: 'btn-auth', type: 'submit' }, isLoginView ? 'Sign In' : 'Get Started')
          ),
          React.createElement('p', { className: 'switch-auth' }, 
            isLoginView ? "Don't have an account? " : "Already have an account? ",
            React.createElement('span', { onClick: () => { setIsLoginView(!isLoginView); setError(''); } }, isLoginView ? 'Sign up for free' : 'Log in')
          )
        )
      )
    );
  }

  // ─── MAIN DASHBOARD COMPONENT (WHAT THEY SEE AFTER LOGIN) ───
  return React.createElement('div', { className: 'app-container' },
    React.createElement('div', { className: 'sidebar' },
      React.createElement('div', { className: 'auth-logo', style: { fontSize: '22px', marginBottom: '40px' } }, 'Pocket', React.createElement('span', null, 'CFO')),
      React.createElement('div', { style: { color: 'var(--text2)', fontSize: '13px' } }, 'DASHBOARD'),
      React.createElement('div', { style: { marginTop: '20px', display: 'flex', flexDirection: 'column', gap: '15px' } },
        ['Overview', 'Obligations', 'Receivables', 'AI Insights'].map(item => 
          React.createElement('div', { key: item, style: { cursor: 'pointer', padding: '10px', borderRadius: '8px' } }, item)
        )
      ),
      React.createElement('div', { className: 'user-badge' },
        React.createElement('div', { style: { width: '32px', height: '32px', borderRadius: '50%', background: 'var(--accent)', color: '#000', display: 'flex', alignItems: 'center', justifyContent: 'center', fontWeight: 'bold' } }, currentUser.name ? currentUser.name[0] : 'U'),
        React.createElement('div', null,
          React.createElement('div', { style: { fontSize: '13px', fontWeight: '600' } }, currentUser.name || 'User'),
          React.createElement('div', { style: { fontSize: '10px', color: 'var(--text3)' } }, currentUser.business || 'Personal')
        )
      ),
      React.createElement('button', { onClick: logout, style: { marginTop: '20px', background: 'none', border: '1px solid var(--border2)', color: 'var(--text2)', padding: '8px', borderRadius: '8px', cursor: 'pointer', width: '100%' } }, 'Sign Out')
    ),
    React.createElement('div', { className: 'main-content' },
      React.createElement('h1', { className: 'auth-title', style: { fontSize: '32px' } }, 'Welcome, ', currentUser.name || 'Financial Wizard', '!'),
      React.createElement('p', { style: { color: 'var(--text2)' } }, 'Your financial health overview for ', currentUser.business || 'your business', '.'),
      
      // SAMPLE DASHBOARD CONTENT
      React.createElement('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: '20px', marginTop: '30px' } },
        [
          { label: 'Available Cash', value: '₹1,25,000', color: 'var(--accent)' },
          { label: 'Upcoming Bills', value: '₹42,000', color: 'var(--danger)' },
          { label: 'Projected Runway', value: '14 Days', color: 'var(--warn)' }
        ].map(stat => 
          React.createElement('div', { key: stat.label, style: { background: 'var(--surface)', padding: '24px', borderRadius: '16px', border: '1px solid var(--border)' } },
            React.createElement('div', { style: { fontSize: '11px', color: 'var(--text3)', fontFamily: 'DM Mono' } }, stat.label),
            React.createElement('div', { style: { fontSize: '28px', fontWeight: 'bold', color: stat.color, marginTop: '8px', fontFamily: 'Syne' } }, stat.value)
          )
        )
      )
    )
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App));
</script>
</body>
</html>
