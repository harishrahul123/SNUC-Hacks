<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PocketCFO — Smart Cash Flow Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0a0c0f;
    --surface: #111418;
    --surface2: #181c22;
    --border: #1e2530;
    --border2: #252d3a;
    --accent: #00e5a0;
    --accent2: #0091ff;
    --danger: #ff4757;
    --warn: #ffa502;
    --text: #e8edf5;
    --text2: #7a8799;
    --text3: #3d4a5c;
    --card-shadow: 0 2px 24px rgba(0,0,0,0.4);
    --glow: 0 0 32px rgba(0,229,160,0.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }
  body::before {
    content: '';
    position: fixed;
    top: -200px; left: -200px;
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(0,229,160,0.04) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }
  #root { position: relative; z-index: 1; }

  /* SCROLLBAR */
  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }

  /* LAYOUT */
  .app { display: flex; min-height: 100vh; }
  .sidebar {
    width: 220px; min-height: 100vh; background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column; padding: 24px 0;
    position: fixed; top: 0; left: 0; z-index: 100;
  }
  .main { margin-left: 220px; flex: 1; padding: 32px; min-height: 100vh; }

  .logo {
    font-family: 'Syne', sans-serif;
    font-size: 18px; font-weight: 800;
    color: var(--text); padding: 0 20px 28px;
    border-bottom: 1px solid var(--border);
    letter-spacing: -0.5px;
  }
  .logo span { color: var(--accent); }

  .nav { padding: 16px 0; flex: 1; }
  .nav-item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 20px; cursor: pointer;
    font-size: 13px; font-weight: 500; color: var(--text2);
    border-left: 2px solid transparent;
    transition: all 0.15s;
  }
  .nav-item:hover { color: var(--text); background: rgba(255,255,255,0.03); }
  .nav-item.active { color: var(--accent); border-left-color: var(--accent); background: rgba(0,229,160,0.05); }
  .nav-item .icon { font-size: 15px; width: 18px; text-align: center; }

  .api-key-section { padding: 16px 20px; border-top: 1px solid var(--border); }
  .api-key-section label { font-size: 10px; color: var(--text3); font-family: 'DM Mono', monospace; letter-spacing: 1px; text-transform: uppercase; display: block; margin-bottom: 6px; }
  .api-key-input {
    width: 100%; background: var(--bg); border: 1px solid var(--border2);
    border-radius: 6px; padding: 7px 10px; color: var(--text2);
    font-size: 11px; font-family: 'DM Mono', monospace;
    outline: none; transition: border 0.15s;

  /* PAGE HEADER */
  .page-header { margin-bottom: 28px; }
  .page-title { font-family: 'Syne', sans-serif; font-size: 26px; font-weight: 700; letter-spacing: -0.5px; }
  .page-sub { color: var(--text2); font-size: 13px; margin-top: 4px; }

  /* CARDS */
  .card {

  .card-title {

  /* GRID */
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
  .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }

  /* RUNWAY BAR */

  .runway-fill { height: 100%; border-radius: 3px; transition: width 0.6s ease; }

  /* BUTTONS */
  .btn {
    display: inline-flex; align-items: center; gap: 7px;

  /* FORM GROUP */

  .form-label { font-size: 11px; color: var(--text2); font-family: 'DM Mono', monospace; letter-spacing: 0.5px; margin-bottom: 5px; display: block; }

  /* AI REASONING BOX */

  /* TABS */
  .tabs { display: flex; gap: 2px; background: var(--surface2); border-radius: 10px; padding: 3px; margin-bottom: 20px; width: fit-content; }
  .tab { padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer; color: var(--text2); transition: all 0.15s; }
  .tab.active { background: var(--surface); color: var(--text); box-shadow: 0 1px 8px rgba(0,0,0,0.3); }

  /* TIMELINE */
  .timeline { position: relative; padding-left: 20px; }
  .timeline::before { content: ''; position: absolute; left: 6px; top: 0; bottom: 0; width: 1px; background: var(--border); }
  .timeline-item { position: relative; padding-bottom: 16px; }
  .timeline-dot { position: absolute; left: -17px; top: 3px; width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--bg); }
  .timeline-date { font-size: 10px; color: var(--text3); font-family: 'DM Mono', monospace; margin-bottom: 3px; }
  .timeline-content { font-size: 13px; color: var(--text2); }

  /* LOADER */
  .loader { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; }

  /* PROGRESS RING */
  .progress-ring { position: relative; display: inline-flex; align-items: center; justify-content: center; }
  .progress-ring svg { transform: rotate(-90deg); }
  .progress-ring .inner { position: absolute; text-align: center; }

  /* TOAST */
  .toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; }
  .toast {
    background: var(--surface2); border: 1px solid var(--border2);

  .toast.success { border-color: rgba(0,229,160,0.3); }
  .toast.error { border-color: rgba(255,71,87,0.3); }
  @keyframes slideIn { from { transform: translateX(20px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

  /* CHART BAR */
  .bar-chart { display: flex; align-items: flex-end; gap: 6px; height: 80px; }
  .bar-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; justify-content: flex-end; }
  .bar { width: 100%; border-radius: 3px 3px 0 0; transition: height 0.4s ease; min-height: 2px; }
  .bar-label { font-size: 9px; color: var(--text3); font-family: 'DM Mono', monospace; }

  /* EMPTY STATE */
  .empty { text-align: center; padding: 40px 20px; color: var(--text3); }
  .empty .icon { font-size: 36px; margin-bottom: 10px; }
  .empty .title { font-size: 14px; color: var(--text2); margin-bottom: 4px; }
  .empty .sub { font-size: 12px; }

  /* EMAIL DRAFT */
  .email-draft { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .email-header { padding: 14px 16px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 4px; }
  .email-field { font-size: 12px; color: var(--text2); font-family: 'DM Mono', monospace; }
  .email-field span { color: var(--text3); }
  .email-body { padding: 16px; font-size: 13px; line-height: 1.7; color: var(--text2); white-space: pre-wrap; }

  /* MODAL OVERLAY */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 500; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .modal { background: var(--surface); border: 1px solid var(--border2); border-radius: 16px; width: 100%; max-width: 560px; max-height: 90vh; overflow-y: auto; }
  .modal-header { padding: 20px 24px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .modal-title { font-family: 'Syne', sans-serif; font-size: 16px; font-weight: 700; }
  .modal-body { padding: 20px 24px; }
  .modal-footer { padding: 16px 24px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 10px; }

  .close-btn { background: none; border: none; color: var(--text3); cursor: pointer; font-size: 18px; line-height: 1; padding: 2px; }
  .close-btn:hover { color: var(--text); }

  /* PRIORITY TAG */
  .priority { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; font-family: 'DM Mono', monospace; }
  .priority.critical { color: var(--danger); }
  .priority.high { color: var(--warn); }
  .priority.medium { color: var(--accent2); }
  .priority.low { color: var(--text3); }

  /* SECTION DIVIDER */
  .section-gap { margin-bottom: 20px; }

  /* COT STEP */
  .cot-step { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .cot-step:last-child { border-bottom: none; }
  .cot-num { width: 22px; height: 22px; border-radius: 50%; background: var(--surface2); border: 1px solid var(--border2); display: flex; align-items: center; justify-content: center; font-size: 10px; font-family: 'DM Mono', monospace; color: var(--accent); flex-shrink: 0; }
  .cot-text { font-size: 12px; line-height: 1.6; color: var(--text2); }

  @media (max-width: 900px) {
    .grid-4 { grid-template-columns: 1fr 1fr; }
    .grid-3 { grid-template-columns: 1fr 1fr; }
  }
  @media (max-width: 600px) {
    .sidebar { display: none; }
    .main { margin-left: 0; padding: 20px; }
    .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
  }
</style>

<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script>
const { useState, useEffect, useRef, useCallback } = React;

// ─── GROQ API ─────────────────────────────────────────────────────────────────
async function callGroq(apiKey, messages, systemPrompt = '') {
  const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
    body: JSON.stringify({
      model: 'llama-3.1-8b-instant',
      messages: [
        ...(systemPrompt ? [{ role: 'system', content: systemPrompt }] : []),
        ...messages
      ],
      temperature: 0.3,
      max_tokens: 2048
    })
  });
  if (!res.ok) throw new Error(`Groq API error: ${res.status} ${await res.text()}`);
  const data = await res.json();
  return data.choices[0].message.content;
}

// ─── DETERMINISTIC ENGINE ──────────────────────────────────────────────────────
function computeRunway(balance, obligations) {
  const sorted = [...obligations].sort((a, b) => new Date(a.dueDate) - new Date(b.dueDate));
  let cash = balance;
  let days = 0;
  const today = new Date();
  for (const o of sorted) {
    const due = new Date(o.dueDate);
    const d = Math.max(0, Math.floor((due - today) / 86400000));
    if (cash < o.amount) return { days, shortfall: o.amount - cash, nextCrisis: o };
    cash -= o.amount;
    days = d;
  }
  return { days: 90, shortfall: 0, nextCrisis: null };
}

function prioritizeObligations(obligations, balance) {
  const PRIORITY_WEIGHTS = { payroll: 5, tax: 4, loan: 4, rent: 4, supplier: 3, utility: 2, other: 1 };
  let cash = balance;
  return obligations.map(o => {
    const today = new Date();
    const due = new Date(o.dueDate);
    const daysLeft = Math.floor((due - today) / 86400000);
    const urgency = daysLeft <= 3 ? 'critical' : daysLeft <= 7 ? 'high' : daysLeft <= 14 ? 'medium' : 'low';
    const weight = (PRIORITY_WEIGHTS[o.category] || 1) + (urgency === 'critical' ? 3 : urgency === 'high' ? 2 : urgency === 'medium' ? 1 : 0);
    return { ...o, daysLeft, urgency, weight };
  }).sort((a, b) => b.weight - a.weight).map(o => {
    const canPay = cash >= o.amount;
    if (canPay) cash -= o.amount;
    return { ...o, canPay, remainingAfter: canPay ? cash : cash };
  });
}

function parseSMSBalance(text) {
  const balMatch = text.match(/(?:balance|bal|avail)[^\d]*([₹$€£]?[\d,]+(?:\.\d{2})?)/i);
  const crMatch = text.match(/([\d,]+(?:\.\d{2})?)\s*(?:CR|credit|credited)/i);
  const drMatch = text.match(/([\d,]+(?:\.\d{2})?)\s*(?:DR|debit|debited)/i);
  return {
    balance: balMatch ? parseFloat(balMatch[1].replace(/[₹$€£,]/g, '')) : null,
    credit: crMatch ? parseFloat(crMatch[1].replace(/,/g, '')) : null,
    debit: drMatch ? parseFloat(drMatch[1].replace(/,/g, '')) : null,
  };
}

// ─── SAMPLE DATA ──────────────────────────────────────────────────────────────
const SAMPLE_OBLIGATIONS = [
  { id: 1, name: 'Staff Payroll', category: 'payroll', amount: 45000, dueDate: new Date(Date.now() + 2 * 86400000).toISOString().slice(0, 10), vendor: 'Employees', flexible: false, penalty: 'Legal risk' },
  { id: 2, name: 'GST Filing', category: 'tax', amount: 12000, dueDate: new Date(Date.now() + 4 * 86400000).toISOString().slice(0, 10), vendor: 'GSTN Portal', flexible: false, penalty: 'Interest + penalty' },
  { id: 3, name: 'Office Rent', category: 'rent', amount: 28000, dueDate: new Date(Date.now() + 6 * 86400000).toISOString().slice(0, 10), vendor: 'PropCo Realty', flexible: true, penalty: 'Late fee' },
  { id: 4, name: 'Cloud Infra (AWS)', category: 'utility', amount: 8500, dueDate: new Date(Date.now() + 10 * 86400000).toISOString().slice(0, 10), vendor: 'Amazon Web Services', flexible: true, penalty: 'Service pause' },
  { id: 5, name: 'Supplier Invoice', category: 'supplier', amount: 31000, dueDate: new Date(Date.now() + 14 * 86400000).toISOString().slice(0, 10), vendor: 'RawMat Industries', flexible: true, penalty: 'Relationship risk' },
];

const SAMPLE_RECEIVABLES = [
  { id: 1, from: 'Acme Corp', amount: 55000, expectedDate: new Date(Date.now() + 5 * 86400000).toISOString().slice(0, 10), status: 'confirmed' },
  { id: 2, from: 'NovaTech Ltd', amount: 30000, expectedDate: new Date(Date.now() + 12 * 86400000).toISOString().slice(0, 10), status: 'pending' },
];

// ─── TOAST SYSTEM ─────────────────────────────────────────────────────────────
function ToastContainer({ toasts }) {
  return React.createElement('div', { className: 'toast-container' },
    toasts.map(t => React.createElement('div', { key: t.id, className: `toast ${t.type}` },
      React.createElement('span', null, t.type === 'success' ? '✓' : '✗'),
      React.createElement('span', null, t.msg)
    ))
  );
}

// ─── SIDEBAR ──────────────────────────────────────────────────────────────────
function Sidebar({ page, setPage, apiKey, setApiKey }) {
  const items = [
    { id: 'dashboard', label: 'Dashboard', icon: '◈' },
    { id: 'obligations', label: 'Obligations', icon: '◉' },
    { id: 'receivables', label: 'Receivables', icon: '◎' },
    { id: 'transactions', label: 'Transaction History', icon: '⊕' },
    { id: 'future', label: 'Future', icon: '⊞' },
    { id: 'actions', label: 'Actions', icon: '◧' },
  ];
  return React.createElement('div', { className: 'sidebar' },
    React.createElement('div', { className: 'logo' }, 'Pocket', React.createElement('span', null, 'CFO')),
    React.createElement('nav', { className: 'nav' },
      items.map(i => React.createElement('div', {
        key: i.id, className: `nav-item ${page === i.id ? 'active' : ''}`,
        onClick: () => setPage(i.id)
      },
        React.createElement('span', { className: 'icon' }, i.icon),
        i.label
      ))
    ),
    React.createElement('div', { className: 'api-key-section' },
      React.createElement('label', null, 'GROQ API KEY'),
      React.createElement('input', {
        type: 'password', className: 'api-key-input',
        placeholder: 'gsk_...', value: apiKey,
        onChange: e => setApiKey(e.target.value)
      })
    )
  );
}

// ─── DASHBOARD ────────────────────────────────────────────────────────────────
function Dashboard({ balance, obligations, receivables }) {
  const prioritized = prioritizeObligations(obligations, balance);
  const runway = computeRunway(balance, obligations);
  const totalObl = obligations.reduce((s, o) => s + o.amount, 0);
  const totalRec = receivables.reduce((s, r) => s + r.amount, 0);
  const projectedBalance = balance + totalRec - totalObl;
  const runwayPct = Math.min(100, (runway.days / 90) * 100);
  const runwayColor = runway.days < 7 ? '#ff4757' : runway.days < 14 ? '#ffa502' : '#00e5a0';

  const upcomingWeek = obligations.filter(o => {
    const d = Math.floor((new Date(o.dueDate) - new Date()) / 86400000);
    return d >= 0 && d <= 7;
  });

  return React.createElement('div', null,

function CashFlowChart({ balance, obligations, receivables }) {
  const days = 30;
  const points = [];
  let cash = balance;
  for (let i = 0; i <= days; i += 3) {
    const date = new Date(Date.now() + i * 86400000);
    const oblOnDay = obligations.filter(o => {
      const d = new Date(o.dueDate);
      return d >= date && d < new Date(date.getTime() + 3 * 86400000);
    }).reduce((s, o) => s + o.amount, 0);
    const recOnDay = receivables.filter(r => {
      const d = new Date(r.expectedDate);
      return d >= date && d < new Date(date.getTime() + 3 * 86400000);
    }).reduce((s, r) => s + r.amount, 0);
    cash = cash - oblOnDay + recOnDay;
    points.push({ label: `D${i}`, value: Math.max(0, cash), raw: cash });
  }
  const max = Math.max(...points.map(p => p.value), 1);

  return React.createElement('div', { className: 'bar-chart' },
    points.map((p, i) =>
      React.createElement('div', { key: i, className: 'bar-wrap', title: `Day ${i * 3}: ₹${p.raw.toLocaleString()}` },
        React.createElement('div', {
          className: 'bar',
          style: {
            height: Math.max(2, (p.value / max) * 68) + 'px',
            background: p.raw < 0 ? 'var(--danger)' : p.raw < balance * 0.3 ? 'var(--warn)' : 'var(--accent)',
            opacity: 0.7 + (i / points.length) * 0.3
          }
        }),
        i % 3 === 0 && React.createElement('div', { className: 'bar-label' }, p.label)
      )
    )
  );
}

// ─── INGEST ───────────────────────────────────────────────────────────────────
function Ingest({ apiKey, setObligations, setReceivables, setBalance, addToast }) {
  const [tab, setTab] = useState('file');
  const [dragging, setDragging] = useState(false);
  const [files, setFiles] = useState([]);
  const [loading, setLoading] = useState(false);
  const [results, setResults] = useState([]);
  const [manualText, setManualText] = useState('');
  const fileRef = useRef();

  const processWithGroq = async (content, filename) => {
    if (!apiKey) throw new Error('Enter your Groq API key in the sidebar');
    const prompt = `You are a financial document parser. Extract financial data from this document.
Document: "${filename}"
Content: ${content.slice(0, 3000)}

Return ONLY valid JSON in this exact format:
{
  "type": "bank_statement|invoice|receipt|expense",
  "balance": number_or_null,
  "transactions": [{"date":"YYYY-MM-DD","description":"string","amount":number,"type":"credit|debit"}],
  "obligations": [{"name":"string","amount":number,"dueDate":"YYYY-MM-DD","vendor":"string","category":"payroll|tax|rent|loan|supplier|utility|other","flexible":false,"penalty":"string"}],
  "receivables": [{"from":"string","amount":number,"expectedDate":"YYYY-MM-DD","status":"pending|confirmed"}],
  "summary": "1-2 sentence summary"
}
Only include arrays that have actual data. Return {} for empty sections.`;

    return await callGroq(apiKey, [{ role: 'user', content: prompt }]);
  };

  const handleFiles = async (fileList) => {
    if (!apiKey) { addToast('Enter Groq API key first', 'error'); return; }
    setLoading(true);
    const newResults = [];
    for (const file of fileList) {
      try {
        let content = '';
        if (file.type === 'application/pdf' || file.type.startsWith('image/')) {
          content = `[File: ${file.name}, Type: ${file.type}, Size: ${(file.size / 1024).toFixed(1)}KB]\nThis is a ${file.type.startsWith('image/') ? 'receipt/invoice image' : 'PDF document'} requiring OCR extraction. Please extract any visible financial data including amounts, dates, vendor names, and transaction details.`;
        } else {
          content = await file.text();
        }
        const raw = await processWithGroq(content, file.name);
        let parsed;
        try { parsed = JSON.parse(raw.replace(/```json\n?|\n?```/g, '').trim()); }
        catch { parsed = { summary: raw, type: 'unknown' }; }
        newResults.push({ file: file.name, data: parsed, status: 'success' });

        // Auto-import
        if (parsed.balance) setBalance(parsed.balance);
        if (parsed.obligations?.length) setObligations(prev => [...prev, ...parsed.obligations.map((o, i) => ({ ...o, id: Date.now() + i }))]);
        if (parsed.receivables?.length) setReceivables(prev => [...prev, ...parsed.receivables.map((r, i) => ({ ...r, id: Date.now() + i }))]);
      } catch (e) {
        newResults.push({ file: file.name, status: 'error', error: e.message });
      }
    }
    setResults(prev => [...newResults, ...prev]);
    setLoading(false);
    addToast(`Processed ${fileList.length} file(s)`, 'success');
  };

  const handleManual = async () => {
    if (!manualText.trim()) return;
    if (!apiKey) { addToast('Enter Groq API key first', 'error'); return; }
    setLoading(true);
    try {
      const raw = await processWithGroq(manualText, 'manual-input.txt');
      let parsed;
      try { parsed = JSON.parse(raw.replace(/```json\n?|\n?```/g, '').trim()); }
      catch { parsed = { summary: raw }; }
      setResults(prev => [{ file: 'Manual Input', data: parsed, status: 'success' }, ...prev]);
      if (parsed.balance) setBalance(parsed.balance);
      if (parsed.obligations?.length) setObligations(prev => [...prev, ...parsed.obligations.map((o, i) => ({ ...o, id: Date.now() + i }))]);
      if (parsed.receivables?.length) setReceivables(prev => [...prev, ...parsed.receivables.map((r, i) => ({ ...r, id: Date.now() + i }))]);
      addToast('Data extracted and imported', 'success');
      setManualText('');
    } catch (e) {
      addToast(e.message, 'error');
    }
    setLoading(false);
  };

  return React.createElement('div', null,
    React.createElement('div', { className: 'page-header' },
      React.createElement('div', { className: 'page-title' }, 'Ingest Financial Data'),
      React.createElement('div', { className: 'page-sub' }, 'Upload bank statements, invoices, receipts, or paste raw text')
    ),

    React.createElement('div', { className: 'tabs' },
      ['file', 'text'].map(t => React.createElement('div', {
        key: t, className: `tab ${tab === t ? 'active' : ''}`,
        onClick: () => setTab(t)
      }, t === 'file' ? '⊕ File Upload' : '✎ Paste Text'))
    ),

    tab === 'file' && React.createElement('div', { className: 'section-gap' },
      React.createElement('div', {
        className: `upload-zone ${dragging ? 'drag' : ''}`,
        onClick: () => fileRef.current.click(),

function SMSExtractor({ apiKey, setBalance, setObligations, setReceivables, addToast }) {
  const [smsText, setSmsText] = useState('');
  const [results, setResults] = useState(null);
  const [loading, setLoading] = useState(false);

  const SAMPLE_SMS = `HDFC Bank: Rs.45,000.00 credited to your a/c XX1234 on 15-01-24 by ACME CORP. Avail Bal: Rs.62,450.00
SBI: Rs.12,500 debited from a/c XX5678 on 16-01-24. UPI ref: 234567890. Avail Bal: Rs.49,950

AXIS: Salary credit Rs.85,000 on 01-01-24. A/c XX3456. Available balance: Rs.1,02,450`;

  const extract = async () => {
    if (!smsText.trim()) return;
    setLoading(true);

{

}

SMS Messages:
${smsText}`;
        const raw = await callGroq(apiKey, [{ role: 'user', content: prompt }]);
        try { extracted = JSON.parse(raw.replace(/```json\n?|\n?```/g, '').trim()); }
        catch { extracted = { insights: [raw] }; }

// ─── FUTURE PAGE ─────────────────────────────────────────────────────────────
function FuturePage({ balance, obligations, receivables }) {
  const [activeMetric, setActiveMetric] = useState(null);

  const totalObl = obligations.reduce((s, o) => s + o.amount, 0);
  const totalRec = receivables.reduce((s, r) => s + r.amount, 0);
  const monthlyExpenses = totalObl; // proxy for monthly burn
  const monthlyRevenue = totalRec;
  const netBurn = monthlyExpenses - monthlyRevenue;

  // Derived metrics from actual data
  const currentRatio = totalObl > 0 ? ((balance + totalRec) / totalObl).toFixed(2) : 'N/A';
  const burnRate = netBurn > 0 ? netBurn : 0;
  const runway = burnRate > 0 ? (balance / burnRate).toFixed(1) : '∞';
  const arTurnover = totalRec > 0 ? (monthlyRevenue / (totalRec / 2 || 1)).toFixed(2) : 'N/A';
  const inventoryTurnover = totalObl > 0 ? (monthlyRevenue / (totalObl * 0.4 || 1)).toFixed(2) : 'N/A';
  const operatingCashFlow = monthlyRevenue - monthlyExpenses * 0.7;
  const capexEstimate = monthlyExpenses * 0.15;
  const opexEstimate = monthlyExpenses * 0.85;

  const metrics = [
    {
      id: 'currentRatio',
      label: 'Current Ratio',
      value: currentRatio,
      unit: 'x',
      icon: '◈',
      description: 'Your ability to meet short-term obligations with available assets',
      formula: '(Cash + Receivables) / Total Payables',
      computed: `(₹${balance.toLocaleString()} + ₹${totalRec.toLocaleString()}) / ₹${totalObl.toLocaleString()}`,
      color: parseFloat(currentRatio) >= 1.5 ? '#00e5a0' : parseFloat(currentRatio) >= 1 ? '#ffa502' : '#ff4757',

// ─── DECISION ENGINE (kept for internal use / Actions) ─────────────────────────────────────────────────────────────────────────────────────────────────────────────────
function DecisionEngine({ apiKey, balance, obligations, receivables, setActions, addToast }) {
  const [analysis, setAnalysis] = useState(null);
  const [loading, setLoading] = useState(false);

  const prioritized = prioritizeObligations(obligations, balance);
  const runway = computeRunway(balance, obligations);
  const shortfallObligations = prioritized.filter(o => !o.canPay);

  const runAnalysis = async () => {
    setLoading(true);
    try {
      const financialState = {
        balance, runway: runway.days,
        shortfall: runway.shortfall,
        obligations: prioritized.map(o => ({
          name: o.name, amount: o.amount, dueDate: o.dueDate,
          daysLeft: o.daysLeft, urgency: o.urgency, canPay: o.canPay,
          flexible: o.flexible, category: o.category, vendor: o.vendor, penalty: o.penalty
        })),
        receivables: receivables.map(r => ({ from: r.from, amount: r.amount, expectedDate: r.expectedDate, status: r.status }))
      };

      let chainOfThought, recommendations;

      if (apiKey) {
        const prompt = `You are a cash flow decision engine for a small business. Analyze this financial state and provide a structured decision plan.

Financial State:
${JSON.stringify(financialState, null, 2)}

Return ONLY valid JSON:
{
  "riskLevel": "critical|high|medium|low",
  "chainOfThought": [
    {"step": 1, "reasoning": "string"},
    {"step": 2, "reasoning": "string"},
    {"step": 3, "reasoning": "string"},
    {"step": 4, "reasoning": "string"}
  ],
  "payNow": [{"name":"string","amount":number,"reason":"string"}],
  "defer": [{"name":"string","amount":number,"suggestedDate":"YYYY-MM-DD","reason":"string","vendor":"string","relationship":"formal|friendly|neutral"}],
  "negotiate": [{"name":"string","amount":number,"vendor":"string","ask":"string","relationship":"formal|friendly|neutral"}],
  "accelerateReceivables": [{"from":"string","amount":number,"action":"string"}],
  "summary": "2-3 sentence executive summary of the situation and recommended path"
}`;

        const raw = await callGroq(apiKey, [{ role: 'user', content: prompt }]);
        try {
          const parsed = JSON.parse(raw.replace(/```json\n?|\n?```/g, '').trim());
          chainOfThought = parsed.chainOfThought;
          recommendations = parsed;
        } catch {
          chainOfThought = [{ step: 1, reasoning: raw }];
          recommendations = { summary: raw, riskLevel: 'unknown' };
        }
      } else {
        // Deterministic fallback
        const payNow = prioritized.filter(o => o.canPay && o.urgency !== 'low');
        const defer = prioritized.filter(o => !o.canPay && o.flexible);
        const negotiate = prioritized.filter(o => !o.canPay && !o.flexible);
        chainOfThought = [
          { step: 1, reasoning: `Current cash balance: ₹${balance.toLocaleString()}. Total obligations: ₹${obligations.reduce((s, o) => s + o.amount, 0).toLocaleString()}` },
          { step: 2, reasoning: `Sorted ${obligations.length} obligations by urgency and category weight. ${shortfallObligations.length} cannot be paid with current balance.` },
          { step: 3, reasoning: `Identified ${defer.length} flexible obligations that can be deferred. ${negotiate.length} require vendor negotiation.` },
          { step: 4, reasoning: `Runway: ${runway.days} days. ${runway.shortfall > 0 ? `Shortfall of ₹${runway.shortfall.toLocaleString()} on next critical obligation.` : 'All obligations can be met in sequence.'}` }
        ];
        recommendations = { payNow, defer, negotiate, riskLevel: runway.days < 7 ? 'critical' : runway.days < 14 ? 'high' : 'medium', summary: `${shortfallObligations.length > 0 ? `${shortfallObligations.length} obligations cannot be met with current balance of ₹${balance.toLocaleString()}.` : 'Current balance can cover all obligations in priority order.'} Runway: ${runway.days} days.` };
      }

      setAnalysis({ chainOfThought, ...recommendations });

      // Generate actions
      const newActions = [];
      if (recommendations.defer?.length) {
        recommendations.defer.forEach(d => {
          newActions.push({ id: Date.now() + Math.random(), type: 'defer', obligation: d.name, vendor: d.vendor, amount: d.amount, reason: d.reason, suggestedDate: d.suggestedDate, relationship: d.relationship || 'neutral', status: 'pending' });
        });
      }
      if (recommendations.negotiate?.length) {
        recommendations.negotiate.forEach(n => {
          newActions.push({ id: Date.now() + Math.random(), type: 'negotiate', obligation: n.name, vendor: n.vendor, amount: n.amount, ask: n.ask, relationship: n.relationship || 'neutral', status: 'pending' });
        });
      }
      if (newActions.length) { setActions(prev => [...newActions, ...prev]); addToast(`${newActions.length} actions generated`, 'success'); }

    } catch (e) { addToast(e.message, 'error'); }
    setLoading(false);
  };

  const riskColors = { critical: 'var(--danger)', high: 'var(--warn)', medium: 'var(--accent2)', low: 'var(--accent)', unknown: 'var(--text3)' };

  return React.createElement('div', null,
    React.createElement('div', { className: 'page-header', style: { display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start' } },
      React.createElement('div', null,
        React.createElement('div', { className: 'page-title' }, 'Decision Engine'),
        React.createElement('div', { className: 'page-sub' }, 'AI-powered obligation prioritization with chain-of-thought reasoning')
      ),
      React.createElement('button', { className: 'btn btn-primary', onClick: runAnalysis, disabled: loading || obligations.length === 0 },
        loading ? React.createElement('span', { className: 'loader' }) : '⊞',
        ' Run Analysis'
      )
    ),

    // PRE-ANALYSIS: deterministic summary
    React.createElement('div', { className: 'grid-3 section-gap' },
      React.createElement('div', { className: 'stat-card' },
        React.createElement('div', { className: 'stat-label' }, 'Can Pay Now'),
        React.createElement('div', { className: 'stat-value green' }, prioritized.filter(o => o.canPay).length),
        React.createElement('div', { className: 'stat-sub' }, 'obligations covered')
      ),
      React.createElement('div', { className: 'stat-card' },
        React.createElement('div', { className: 'stat-label' }, 'Shortfall'),
        React.createElement('div', { className: 'stat-value red' }, shortfallObligations.length),
        React.createElement('div', { className: 'stat-sub' }, runway.shortfall > 0 ? `₹${runway.shortfall.toLocaleString()} gap` : 'No gap')
      ),
      React.createElement('div', { className: 'stat-card' },
        React.createElement('div', { className: 'stat-label' }, 'Flexible'),
        React.createElement('div', { className: 'stat-value', style: { color: 'var(--accent2)' } }, obligations.filter(o => o.flexible).length),
        React.createElement('div', { className: 'stat-sub' }, 'can be deferred')
      )
    ),

    !analysis && obligations.length > 0 && React.createElement('div', { className: 'card section-gap' },
      React.createElement('div', { className: 'card-title' }, 'Priority Queue Preview'),
      React.createElement('table', { className: 'table' },
        React.createElement('thead', null,
          React.createElement('tr', null,
            React.createElement('th', null, '#'),
            React.createElement('th', null, 'Obligation'),
            React.createElement('th', null, 'Urgency'),
            React.createElement('th', null, 'Amount'),
            React.createElement('th', null, 'Decision')
          )
        ),
        React.createElement('tbody', null,
          prioritized.map((o, i) =>
            React.createElement('tr', { key: o.id },
              React.createElement('td', null, React.createElement('span', { style: { fontFamily: 'DM Mono', fontSize: 11, color: 'var(--text3)' } }, `#${i + 1}`)),
              React.createElement('td', null, React.createElement('span', { style: { color: 'var(--text)', fontWeight: 500 } }, o.name)),
              React.createElement('td', null, React.createElement('span', { className: `priority ${o.urgency}` }, o.urgency.toUpperCase())),
              React.createElement('td', null, React.createElement('span', { style: { fontFamily: 'DM Mono', fontSize: 12 } }, '₹' + o.amount.toLocaleString())),
              React.createElement('td', null,
                React.createElement('span', { className: `badge ${o.canPay ? 'badge-green' : o.flexible ? 'badge-warn' : 'badge-red'}` },
                  o.canPay ? 'PAY' : o.flexible ? 'DEFER' : 'NEGOTIATE')
              )
            )
          )
        )
      )
    ),

    analysis && React.createElement('div', null,
      // RISK + SUMMARY
      React.createElement('div', { className: 'card section-gap', style: { borderColor: riskColors[analysis.riskLevel] + '44' } },
        React.createElement('div', { style: { display: 'flex', justifyContent: 'space-between', marginBottom: 10 } },
          React.createElement('div', { className: 'card-title' }, 'Executive Summary'),
          React.createElement('span', { className: 'badge', style: { background: riskColors[analysis.riskLevel] + '22', color: riskColors[analysis.riskLevel] } },
            (analysis.riskLevel || 'UNKNOWN').toUpperCase() + ' RISK'
          )
        ),
        React.createElement('div', { style: { fontSize: 14, lineHeight: 1.7, color: 'var(--text2)' } }, analysis.summary)
      ),

      // CHAIN OF THOUGHT
      analysis.chainOfThought?.length > 0 && React.createElement('div', { className: 'card section-gap' },
        React.createElement('div', { className: 'card-title' }, 'Chain of Thought Reasoning'),
        React.createElement('div', null,
          analysis.chainOfThought.map(s =>
            React.createElement('div', { key: s.step, className: 'cot-step' },
              React.createElement('div', { className: 'cot-num' }, s.step),
              React.createElement('div', { className: 'cot-text' }, s.reasoning)
            )
          )
        )
      ),

      // DECISIONS
      React.createElement('div', { className: 'grid-2' },
        analysis.payNow?.length > 0 && React.createElement('div', { className: 'card' },
          React.createElement('div', { className: 'card-title' }, '✓ Pay Now'),
          analysis.payNow.map((p, i) =>
            React.createElement('div', { key: i, style: { padding: '8px 0', borderBottom: '1px solid var(--border)', fontSize: 13 } },
              React.createElement('div', { style: { fontWeight: 600, color: 'var(--text)' } }, p.name),
              React.createElement('div', { style: { color: 'var(--accent)', fontFamily: 'DM Mono', fontSize: 12 } }, '₹' + p.amount?.toLocaleString()),
              React.createElement('div', { style: { color: 'var(--text3)', fontSize: 12, marginTop: 2 } }, p.reason)
            )
          )
        ),

        (analysis.defer?.length > 0 || analysis.negotiate?.length > 0) && React.createElement('div', { className: 'card' },
          React.createElement('div', { className: 'card-title' }, '↻ Defer / Negotiate'),
          [...(analysis.defer || []), ...(analysis.negotiate || [])].map((d, i) =>
            React.createElement('div', { key: i, style: { padding: '8px 0', borderBottom: '1px solid var(--border)', fontSize: 13 } },
              React.createElement('div', { style: { display: 'flex', justifyContent: 'space-between' } },
                React.createElement('span', { style: { fontWeight: 600, color: 'var(--text)' } }, d.name),
                React.createElement('span', { className: `badge ${d.suggestedDate ? 'badge-warn' : 'badge-blue'}` }, d.suggestedDate ? 'DEFER' : 'NEGOTIATE')
              ),
              React.createElement('div', { style: { color: 'var(--warn)', fontFamily: 'DM Mono', fontSize: 12 } }, '₹' + d.amount?.toLocaleString()),
              React.createElement('div', { style: { color: 'var(--text3)', fontSize: 12, marginTop: 2 } }, d.reason || d.ask)
            )
          )
        )
      )
    ),

    obligations.length === 0 && React.createElement('div', { className: 'empty' },
      React.createElement('div', { className: 'icon' }, '⊞'),
      React.createElement('div', { className: 'title' }, 'No obligations to analyze'),
      React.createElement('div', { className: 'sub' }, 'Add obligations first, then run the decision engine')
    )
  );
}

// ─── ACTIONS / EMAIL DRAFTS ───────────────────────────────────────────────────
function Actions({ apiKey, actions, setActions, addToast }) {
  const [selected, setSelected] = useState(null);
  const [draft, setDraft] = useState(null);
  const [loading, setLoading] = useState(false);
  const [customObligation, setCustomObligation] = useState({ vendor: '', amount: '', ask: '', relationship: 'neutral', type: 'defer' });
  const [showCustom, setShowCustom] = useState(false);

  const generateEmail = async (action) => {
    setSelected(action);
    setLoading(true);
    setDraft(null);
    try {
      let emailContent;
      if (apiKey) {
        const toneMap = { formal: 'professional and formal', friendly: 'warm and friendly', neutral: 'polite and neutral' };
        const tone = toneMap[action.relationship] || 'polite';
        const prompt = `Draft a ${tone} business email for a small business owner.
Situation: ${action.type === 'defer' ? `Request to defer payment of ₹${action.amount?.toLocaleString()} to ${action.vendor}` : `Negotiate payment terms of ₹${action.amount?.toLocaleString()} with ${action.vendor}`}
${action.type === 'defer' ? `New proposed date: ${action.suggestedDate || 'to be agreed'}` : `Ask: ${action.ask}`}
${action.reason ? `Reason: ${action.reason}` : ''}
Relationship: ${action.relationship}

Return ONLY valid JSON:
{
  "subject": "string",
  "to": "${action.vendor || 'Vendor'}",
  "body": "full email body (no JSON, no markdown, just the email text)"
}`;
        const raw = await callGroq(apiKey, [{ role: 'user', content: prompt }]);
        try {
          const p = JSON.parse(raw.replace(/```json\n?|\n?```/g, '').trim());
          emailContent = p;
        } catch {
          emailContent = { subject: `Re: Payment for ${action.obligation}`, to: action.vendor, body: raw };
        }
      } else {
        emailContent = {
          subject: `Payment Schedule Discussion — ${action.obligation}`,
          to: action.vendor || 'Vendor',
          body: `Dear ${action.vendor || 'Team'},\n\nI hope this message finds you well.\n\nI am writing regarding the payment of ₹${action.amount?.toLocaleString()} for ${action.obligation}.\n\n${action.type === 'defer' ? `Due to temporary cash flow constraints, I would like to request a deferral to ${action.suggestedDate || 'a mutually agreed date'}.` : `I would like to discuss adjusted payment terms. ${action.ask || ''}`}\n\nI value our relationship and am committed to settling this at the earliest. Please let me know your thoughts.\n\nBest regards,\n[Your Name]\n[Your Business]`
        };
      }
      setDraft(emailContent);
    } catch (e) { addToast(e.message, 'error'); }
    setLoading(false);
  };

  const markDone = (id) => {
    setActions(prev => prev.map(a => a.id === id ? { ...a, status: 'done' } : a));
    if (selected?.id === id) setSelected(null);
    addToast('Action marked as done', 'success');
  };

  const createCustom = async () => {
    const action = { id: Date.now(), ...customObligation, obligation: customObligation.vendor + ' Payment', status: 'pending' };
    await generateEmail(action);
    setShowCustom(false);
  };

  return React.createElement('div', null,
    React.createElement('div', { className: 'page-header', style: { display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start' } },
      React.createElement('div', null,
        React.createElement('div', { className: 'page-title' }, 'Actions & Drafts'),
        React.createElement('div', { className: 'page-sub' }, 'Review AI-suggested actions and generate negotiation emails')
      ),
      React.createElement('button', { className: 'btn btn-secondary', onClick: () => setShowCustom(true) }, '+ Custom Draft')
    ),

    React.createElement('div', { className: 'grid-2' },
      // ACTION LIST
      React.createElement('div', null,
        actions.length === 0
          ? React.createElement('div', { className: 'empty' },
              React.createElement('div', { className: 'icon' }, '◧'),
              React.createElement('div', { className: 'title' }, 'No actions yet'),
              React.createElement('div', { className: 'sub' }, 'Run the Decision Engine to generate recommended actions')
            )
          : actions.map(a =>
              React.createElement('div', {
                key: a.id,
                className: 'card',
                style: { marginBottom: 12, cursor: 'pointer', borderColor: selected?.id === a.id ? 'var(--accent)' : 'var(--border)', opacity: a.status === 'done' ? 0.5 : 1 },
                onClick: () => a.status !== 'done' && generateEmail(a)
              },
                React.createElement('div', { style: { display: 'flex', justifyContent: 'space-between', marginBottom: 8 } },
                  React.createElement('span', { className: `badge ${a.type === 'defer' ? 'badge-warn' : 'badge-blue'}` }, a.type.toUpperCase()),
                  React.createElement('span', { className: `badge ${a.status === 'done' ? 'badge-green' : 'badge-gray'}` }, a.status)
                ),
                React.createElement('div', { style: { fontWeight: 600, color: 'var(--text)', fontSize: 14, marginBottom: 4 } }, a.obligation),
                a.vendor && React.createElement('div', { style: { fontSize: 12, color: 'var(--text3)' } }, 'Vendor: ' + a.vendor),
                a.amount && React.createElement('div', { style: { fontFamily: 'DM Mono', fontSize: 12, color: 'var(--warn)', marginTop: 4 } }, '₹' + a.amount?.toLocaleString()),
                a.status !== 'done' && React.createElement('div', { style: { display: 'flex', gap: 8, marginTop: 10 } },
                  React.createElement('button', {
                    className: 'btn btn-secondary btn-sm',
                    onClick: (e) => { e.stopPropagation(); generateEmail(a); }
                  }, '✎ Draft Email'),
                  React.createElement('button', {
                    className: 'btn btn-primary btn-sm',
                    onClick: (e) => { e.stopPropagation(); markDone(a.id); }
                  }, '✓ Done')
                )
              )
            )
      ),

      // EMAIL DRAFT
      React.createElement('div', null,
        loading && React.createElement('div', { className: 'card', style: { textAlign: 'center', padding: 30 } },
          React.createElement('span', { className: 'loader' }),
          React.createElement('div', { style: { marginTop: 8, color: 'var(--text2)', fontSize: 13 } }, 'Drafting email...')
        ),
        !loading && draft && React.createElement('div', null,
          React.createElement('div', { className: 'card-title' }, '✎ Draft Email'),
          React.createElement('div', { className: 'email-draft' },
            React.createElement('div', { className: 'email-header' },
              React.createElement('div', { className: 'email-field' },
                React.createElement('span', null, 'TO: '), draft.to),
              React.createElement('div', { className: 'email-field' },
                React.createElement('span', null, 'SUBJECT: '), draft.subject)
            ),
            React.createElement('div', { className: 'email-body' }, draft.body)
          ),
          React.createElement('div', { style: { display: 'flex', gap: 8, marginTop: 12 } },
            React.createElement('button', {
              className: 'btn btn-secondary btn-sm',
              onClick: () => { navigator.clipboard.writeText(`To: ${draft.to}\nSubject: ${draft.subject}\n\n${draft.body}`); addToast('Copied to clipboard', 'success'); }
            }, '⊕ Copy'),
            selected && React.createElement('button', {
              className: 'btn btn-primary btn-sm',
              onClick: () => markDone(selected.id)
            }, '✓ Mark Done')
          )
        ),
        !loading && !draft && React.createElement('div', { className: 'empty' },
          React.createElement('div', { className: 'icon' }, '✎'),
          React.createElement('div', { className: 'title' }, 'Select an action to draft'),
          React.createElement('div', { className: 'sub' }, 'Click an action on the left to generate a negotiation email')
        )
      )
    ),

    showCustom && React.createElement('div', { className: 'modal-overlay', onClick: () => setShowCustom(false) },
      React.createElement('div', { className: 'modal', onClick: e => e.stopPropagation() },
        React.createElement('div', { className: 'modal-header' },
          React.createElement('div', { className: 'modal-title' }, 'Custom Email Draft'),
          React.createElement('button', { className: 'close-btn', onClick: () => setShowCustom(false) }, '✕')
        ),
        React.createElement('div', { className: 'modal-body' },
          React.createElement('div', { className: 'form-group' },
            React.createElement('label', { className: 'form-label' }, 'Vendor / Counterparty'),
            React.createElement('input', { className: 'input', value: customObligation.vendor, onChange: e => setCustomObligation(f => ({ ...f, vendor: e.target.value })), placeholder: 'Vendor name' })
          ),
          React.createElement('div', { className: 'form-group' },
            React.createElement('label', { className: 'form-label' }, 'Amount (₹)'),
            React.createElement('input', { className: 'input', type: 'number', value: customObligation.amount, onChange: e => setCustomObligation(f => ({ ...f, amount: e.target.value })) })
          ),
          React.createElement('div', { className: 'form-group' },
            React.createElement('label', { className: 'form-label' }, 'What to ask / request'),
            React.createElement('textarea', { className: 'textarea', rows: 3, value: customObligation.ask, onChange: e => setCustomObligation(f => ({ ...f, ask: e.target.value })), placeholder: 'Extend payment by 15 days, partial payment plan, etc.' })
          ),
          React.createElement('div', { className: 'form-group' },
            React.createElement('label', { className: 'form-label' }, 'Email Type'),
            React.createElement('select', { className: 'select', style: { width: '100%' }, value: customObligation.type, onChange: e => setCustomObligation(f => ({ ...f, type: e.target.value })) },
              React.createElement('option', { value: 'defer' }, 'Defer Payment'),
              React.createElement('option', { value: 'negotiate' }, 'Negotiate Terms')
            )
          ),
          React.createElement('div', { className: 'form-group' },
            React.createElement('label', { className: 'form-label' }, 'Relationship Tone'),
            React.createElement('select', { className: 'select', style: { width: '100%' }, value: customObligation.relationship, onChange: e => setCustomObligation(f => ({ ...f, relationship: e.target.value })) },
              React.createElement('option', { value: 'formal' }, 'Formal / Professional'),
              React.createElement('option', { value: 'neutral' }, 'Neutral / Polite'),
              React.createElement('option', { value: 'friendly' }, 'Friendly / Warm')
            )
          )
        ),
        React.createElement('div', { className: 'modal-footer' },
          React.createElement('button', { className: 'btn btn-secondary', onClick: () => setShowCustom(false) }, 'Cancel'),
          React.createElement('button', { className: 'btn btn-primary', onClick: createCustom, disabled: loading || !customObligation.vendor }, 'Generate Draft')
        )
      )
    )
  );
}

// ─── ROOT APP ─────────────────────────────────────────────────────────────────
function App() {
  const [page, setPage] = useState('dashboard');
  const [apiKey, setApiKey] = useState('');
  const [balance, setBalance] = useState(62450);
  const [obligations, setObligations] = useState(SAMPLE_OBLIGATIONS);
  const [receivables, setReceivables] = useState(SAMPLE_RECEIVABLES);
  const [actions, setActions] = useState([]);
  const [toasts, setToasts] = useState([]);

  const addToast = useCallback((msg, type = 'success') => {
    const id = Date.now();
    setToasts(prev => [...prev, { id, msg, type }]);
    setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 3500);
  }, []);

  const pages = {
    dashboard: React.createElement(Dashboard, { balance, obligations, receivables }),
    obligations: React.createElement(Obligations, { obligations, setObligations, addToast }),
    receivables: React.createElement(Receivables, { receivables, setReceivables, addToast }),
    transactions: React.createElement(TransactionHistory, { apiKey, setObligations, setReceivables, setBalance, addToast }),
    future: React.createElement(FuturePage, { balance, obligations, receivables }),
    actions: React.createElement(Actions, { apiKey, actions, setActions, addToast }),
  };

  return React.createElement('div', { className: 'app' },
    React.createElement(Sidebar, { page, setPage, apiKey, setApiKey }),
    React.createElement('div', { className: 'main' },
      // Balance editor strip
      React.createElement('div', { style: { display: 'flex', justifyContent: 'flex-end', marginBottom: 8, alignItems: 'center', gap: 8 } },
        React.createElement('span', { style: { fontSize: 12, color: 'var(--text3)', fontFamily: 'DM Mono' } }, 'CASH BALANCE ₹'),
        React.createElement('input', {
          className: 'input',
          type: 'number',
          value: balance,
          onChange: e => setBalance(parseFloat(e.target.value) || 0),
          style: { width: 130, padding: '6px 10px', fontSize: 13, fontFamily: 'DM Mono' }
        })
      ),
      pages[page]
    ),
    React.createElement(ToastContainer, { toasts })
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
